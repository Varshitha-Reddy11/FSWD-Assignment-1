<!DOCTYPE html>
<html>
<head>
    <title>Menu</title>

    <style>
        .menu {
            display: flex;
            width: 800px;
            margin: 30px auto;
        }

        .menu a {
            padding: 15px 25px;
            text-decoration: none;
            color: black;
            border: 1px solid #ddd;
            font-family: Arial;
        }

        .dashboard {
            background-color: #dceeff;
        }

        .profile {
            background-color: #e3f4d7;
        }

        .orders {
            background-color: #fff0d0;
        }

        .products {
            background-color: #f5dfea;
        }

        .reports {
            background-color: #e5e3f5;
        }

        .settings {
            background-color: #f5ead7;
        }

        .logout {
            background-color: #f8e1e1;
        }
    </style>
</head>

<body>

    <div class="menu">

        <a href="#" class="dashboard">Dashboard</a>

        <a href="#" class="profile">Profile</a>

        <a href="#" class="orders">Orders</a>

        <a href="#" class="products">Products</a>

        <a href="#" class="reports">Reports</a>

        <a href="#" class="settings">Settings</a>

        <a href="#" class="logout">Logout</a>

    </div>

</body>
</html>
